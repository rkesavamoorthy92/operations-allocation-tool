[project]
name = "operations-allocation-tool"
version = "0.1.0"
description = "Offline Operations Allocation and Quality Management Tool"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pyside6>=6.7",
    "pywin32>=312",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
url = "https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/external-pypi/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
